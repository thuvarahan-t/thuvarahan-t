name: Generate 3D contribution profile

on:
  schedule:
    - cron: "0 18 * * *"     # daily, 23:30 Sri Lanka time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate 3D contribution calendar + stats
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # Optional: add a classic PAT (repo + read:user) as PROFILE_TOKEN
          # so private-repo contributions are counted too.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit the SVGs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --cached --quiet || git commit -m "chore: refresh 3D contribution profile"
          git push
