name: Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#f2f1ee&color_dots=#1c1c1f,#4a261a,#86391f,#c9562c,#ff7a45
            dist/snake-light.svg?color_snake=#121214&color_dots=#e9e7e2,#ffd9c7,#ffb08a,#f57e4b,#ec5b24

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
