name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:           # run manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (brand colours from thuvarahan.me)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#ff4a17&color_dots=#ece7da,#e7ffa0,#d8ff3f,#a8c92e,#0a5750
            dist/snake-dark.svg?color_snake=#ff4a17&color_dots=#1b1b16,#3a4a12,#6f8f1c,#b4d936,#d8ff3f

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
