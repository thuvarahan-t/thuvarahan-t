<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Thuvarahan Thayalan — Full-Stack Developer">
  <style>
    .card { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    .fade { animation: fade 1s ease both; }
    .d1 { animation-delay: .9s; } .d2 { animation-delay: 1.3s; } .d3 { animation-delay: 2.6s; }
    .blink { animation: blink 1s steps(1) infinite; }
    .flick { animation: flick 4s steps(1) infinite; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .6s 1.8s cubic-bezier(.3,1.6,.5,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes flick { 0% { opacity: 1; } 92% { opacity: .15; } 94% { opacity: 1; } 96% { opacity: .3; } 98% { opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pop { from { opacity: 0; transform: scale(.2) rotate(-40deg); } to { opacity: 1; transform: none; } }
  </style>
  <defs>
    <clipPath id="nameClip"><rect x="190" y="95" width="0" height="110">
      <animate attributeName="width" from="0" to="880" dur="1.1s" begin=".5s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
    </rect></clipPath>
    <path id="ring" d="M 1092 196 m -58 0 a 58 58 0 1 1 116 0 a 58 58 0 1 1 -116 0"/>
  </defs>

  <rect width="1200" height="430" fill="#d8ff3f"/>
  <line x1="150" y1="0" x2="150" y2="430" stroke="#14140f" stroke-opacity=".07" stroke-width="1"/><line x1="300" y1="0" x2="300" y2="430" stroke="#14140f" stroke-opacity=".07" stroke-width="1"/><line x1="450" y1="0" x2="450" y2="430" stroke="#14140f" stroke-opacity=".07" stroke-width="1"/><line x1="600" y1="0" x2="600" y2="430" stroke="#14140f" stroke-opacity=".07" stroke-width="1"/><line x1="750" y1="0" x2="750" y2="430" stroke="#14140f" stroke-opacity=".07" stroke-width="1"/><line x1="900" y1="0" x2="900" y2="430" stroke="#14140f" stroke-opacity=".07" stroke-width="1"/><line x1="1050" y1="0" x2="1050" y2="430" stroke="#14140f" stroke-opacity=".07" stroke-width="1"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="700" fill="#14140f" class="fade">
    <text x="40" y="44" letter-spacing="2">TT / INDEX</text>
    <text x="1160" y="44" text-anchor="end" letter-spacing="2">UNIVERSITY OF MORATUWA · SRI LANKA</text>
  </g>

  <g class="card">
    <rect x="160" y="78" width="880" height="252" fill="#14140f" transform="translate(12 12)"/>
    <rect x="160" y="78" width="880" height="252" fill="#f7f4ec" stroke="#14140f" stroke-width="3"/>

    <g clip-path="url(#nameClip)">
      <text x="192" y="178" font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="900" font-size="80" fill="#14140f" textLength="755" lengthAdjust="spacingAndGlyphs">THUVARAHAN THAYALAN</text>
    </g>
    <rect x="964" y="122" width="22" height="58" fill="#ff4a17" class="blink"/>

    <rect x="192" y="198" width="0" height="4" fill="#14140f">
      <animate attributeName="width" from="0" to="816" dur="1s" begin="1.1s" fill="freeze" calcMode="spline" keySplines=".2 .8 .2 1" keyTimes="0;1"/>
    </rect>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" font-weight="700" fill="#14140f" class="fade d2">
      <text x="192" y="232" letter-spacing="2.5">FULL-STACK DEVELOPER — BACKEND &amp; DEVOPS</text>
      <text x="1008" y="232" text-anchor="end" letter-spacing="2" class="flick">GPA 3.6</text>
    </g>

    <rect x="192" y="252" width="816" height="18" fill="none" stroke="#14140f" stroke-width="2"/>
    <rect x="196" y="256" width="0" height="10" fill="#14140f">
      <animate attributeName="width" values="0;260;420;700;808;808" keyTimes="0;.2;.35;.6;.75;1" dur="6s" begin="1.3s" repeatCount="indefinite"/>
    </rect>

    <text x="192" y="304" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.5" fill="#635f4d" class="fade d3" textLength="816" lengthAdjust="spacing">Ships full-stack systems end to end — and builds the hardware when software alone will not do the job.</text>
  </g>

  <g class="pop">
    <circle cx="1092" cy="196" r="78" fill="#ff4a17" stroke="#14140f" stroke-width="3"/>
    <g class="spin">
      <circle cx="1092" cy="196" r="76" fill="none"/>
      <text font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13.2" font-weight="700" fill="#14140f" letter-spacing="1.2">
        <textPath href="#ring" textLength="360" lengthAdjust="spacing">OPEN TO SE INTERNSHIPS ✳ COLOMBO / REMOTE ✳ </textPath>
      </text>
    </g>
    <text x="1092" y="209" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="900" font-size="38" fill="#14140f">TT</text>
  </g>
  
  <g>
    <rect x="0" y="384" width="1200" height="46" fill="#14140f"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" font-weight="700" fill="#d8ff3f" letter-spacing="1">
      <g>
        <text x="0" y="413.5" textLength="2006" lengthAdjust="spacing">JAVA  ✳  SPRING BOOT  ✳  NEXT.JS  ✳  REACT  ✳  TYPESCRIPT  ✳  POSTGRESQL  ✳  SUPABASE  ✳  AWS  ✳  DOCKER  ✳  CI/CD  ✳  REACT NATIVE  ✳  EMBEDDED SYSTEMS  ✳  IOT  ✳  </text>
        <text x="2006" y="413.5" textLength="2006" lengthAdjust="spacing">JAVA  ✳  SPRING BOOT  ✳  NEXT.JS  ✳  REACT  ✳  TYPESCRIPT  ✳  POSTGRESQL  ✳  SUPABASE  ✳  AWS  ✳  DOCKER  ✳  CI/CD  ✳  REACT NATIVE  ✳  EMBEDDED SYSTEMS  ✳  IOT  ✳  </text>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-2006 0" dur="28s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
</svg>
