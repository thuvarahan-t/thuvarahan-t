<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-label="Let's put something into production">
  <style>
    .rise { animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
    .d1 { animation-delay: .35s; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 9s linear infinite; }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect width="1200" height="250" fill="#14140f"/>
  
  <g>
    <rect x="0" y="0" width="1200" height="40" fill="#d8ff3f"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" font-weight="700" fill="#14140f" letter-spacing="1">
      <g>
        <text x="0" y="25.8" textLength="1802" lengthAdjust="spacing">JAVA  ✳  SPRING BOOT  ✳  NEXT.JS  ✳  REACT  ✳  TYPESCRIPT  ✳  POSTGRESQL  ✳  SUPABASE  ✳  AWS  ✳  DOCKER  ✳  CI/CD  ✳  REACT NATIVE  ✳  EMBEDDED SYSTEMS  ✳  IOT  ✳  </text>
        <text x="1802" y="25.8" textLength="1802" lengthAdjust="spacing">JAVA  ✳  SPRING BOOT  ✳  NEXT.JS  ✳  REACT  ✳  TYPESCRIPT  ✳  POSTGRESQL  ✳  SUPABASE  ✳  AWS  ✳  DOCKER  ✳  CI/CD  ✳  REACT NATIVE  ✳  EMBEDDED SYSTEMS  ✳  IOT  ✳  </text>
        <animateTransform attributeName="transform" type="translate" from="-1802 0" to="0 0" dur="32s" repeatCount="indefinite"/>
      </g>
    </g>
  </g>
  <g class="rise">
    <text x="60" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#d8ff3f" letter-spacing="3">OPEN CHANNEL</text>
    <text x="60" y="172" font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="900" font-size="46" fill="#f7f4ec" textLength="880" lengthAdjust="spacingAndGlyphs">LET’S PUT SOMETHING INTO PRODUCTION</text>
    <rect x="952" y="134" width="20" height="42" fill="#d8ff3f" class="blink"/>
  </g>
  <g class="rise d1" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#ece7da">
    <text x="60" y="214" letter-spacing="1">Open to software engineering internships — Colombo or remote.</text>
  </g>
  <g class="spin">
    <text x="1080" y="178" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="120" font-weight="900" fill="#ff4a17">✳</text>
  </g>
</svg>
